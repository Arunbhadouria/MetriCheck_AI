version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: metricheck-db
    environment:
      POSTGRES_DB: metricheck
      POSTGRES_USER: metricheck_user
      POSTGRES_PASSWORD: metricheck_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metricheck_user -d metricheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metricheck-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: metricheck-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://metricheck_user:metricheck_pass@postgres:5432/metricheck
      JWT_ACCESS_SECRET: metricheck_jwt_secret_2026
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: metricheck-ai
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DEMO_MODE: "true"

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: metricheck-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
